service: telegram-websockets
useDotenv: true

provider:
  name: aws
  stage: prod
  region: eu-central-1
  memorySize: 512
  timeout: 30
  runtime: ${self:custom.runtimeByStage.${sls:stage}, 'nodejs24.x'}
  architecture: arm64
  environment:
    IMAGES_BUCKET_NAME: ${self:custom.imagesBucketName}
    CHAT_DATA_BUCKET_NAME: ${self:custom.chatDataBucketName}
    region: eu-central-1
    stage: ${sls:stage}
  iam:
    role:
      statements: ${file(roleStatements.yml)}

functions:
  connect:
    handler: src/handlers.connect
    events:
      - websocket:
          route: $connect
  disconnect:
    handler: src/handlers.disconnect
    events:
      - websocket:
          route: $disconnect
  stats:
    handler: src/handlers.stats
    events:
      - websocket:
          route: stats

  broadcastStats:
    handler: src/handlers.broadcastStats

  getChatByName:
    handler: src/handlers.getChatByName
    events:
      - http:
          path: /search
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Access-Control-Allow-Origin

custom:
  runtimeByStage:
    local: nodejs24.x
  esbuildTargetByStage:
    local: node24
  imagesBucketName: chat-profile-images
  chatDataBucketName: chat-profile-data
  serverless-offline:
    httpPort: 4000
    useChildProcesses: true
    reloadHandler: true
  esbuild:
    minify: true
    nativeZip: true
    target: ${self:custom.esbuildTargetByStage.${sls:stage}, 'node24'}
    platform: node
    exclude:
      - "@aws-sdk/client-apigatewaymanagementapi"
      - "@aws-sdk/client-dynamodb"
      - "@aws-sdk/lib-dynamodb"

package:
  individually: true

build:
  esbuild: false

plugins:
  - serverless-offline
  - serverless-esbuild

resources:
  ${file(resources.yml)}
